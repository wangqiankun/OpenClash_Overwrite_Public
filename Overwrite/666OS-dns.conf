# --- 以下为 MihomoPro 配置专用覆写 ---
[General]
CORE_TYPE = Meta
AUTO_SMART_SWITCH = 0
ENABLE_REDIRECT_DNS = 1
; 不启用 OpenClash 插件的“自定义 DNS 覆写”。
; 也就是 OpenClash 不会用插件界面里的自定义 DNS 设置去强行改写配置文件里的 dns: 段。
; 管整段 dns: 是否用插件内置 DNS 模板
ENABLE_CUSTOM_DNS = 0
; OpenClash 生成最终配置时会用该开关强制写入 dns.respect-rules。
; 设为 1 才能让运行态保持 respect-rules: true；不等同于启用整段 DNS 自定义覆写。
ENABLE_RESPECT_RULES = 1
ROUTER_SELF_PROXY = 0
APPEND_DEFAULT_DNS = 0
STORE_FAKEIP = 1
; 启用 OpenClash 插件层的 Meta 域名嗅探开关，让 LuCI 面板和运行态配置保持一致。
ENABLE_META_SNIFFER = 1
ENABLE_META_SNIFFER_CUSTOM = 1
ENABLE_META_SNIFFER_PURE_IP = 1
DISABLE_UDP_QUIC = 1
; 建议 LuCI 开启「定时重启」每天凌晨 4 点，避免 TUN/nft/conntrack 长期运行后需整机重启（插件设置 → 插件设置 → 定时重启）

#restart: true 代表更新后重启插件，false 代表不重启插件
#force: true 代表强制下载，false 代表不强制下载（当文件不存在时会自动下载）
#cron: 定时下载时间，格式为标准的 cron 表达式，0 代表不启用定时下载
#示例：每天凌晨6点下载一次
#cron=0 6 * * *
#示例：每周一凌晨6点下载一次
#cron=0 6 * * 1
DOWNLOAD_FILE = url=https://gh-proxy.991886.xyz/https://raw.githubusercontent.com/wangqiankun/OpenClash_Overwrite_Public/refs/heads/main/Yaml/666OS-DNS-Conf.yaml, path=/etc/openclash/config/666OS-dns.yaml, cron=0 6 * * *, force=true

#将模板作为默认配置文件
CONFIG_FILE = /etc/openclash/config/666OS-dns.yaml

#指定展示订阅信息的 URL 地址
; SUB_INFO_URL = $EN_KEY1
SUB_INFO_URL = $EN_KEY

[Overwrite]
#EN_KEY 为对应模块需要用户指定的环境变量值, EN_KEY1=URL1;EN_KEY2=URL2;EN_KEY3=URL3
#其他 Ruby 编辑函数请参考 openclash_custom_overwrite.sh
; ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "优质服务商" "['url']" "$EN_KEY1"
; ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "备用服务商" "['url']" "$EN_KEY2"
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "Sub-store" "['url']" "$EN_KEY"
; # NodeGet 控制台会直接查询 GitHub Releases，固定走独立出口以避免共享 IP 触发 API 限流。
; ruby_arr_insert "$CONFIG_FILE" "['rules']" "0" "DOMAIN,api.github.com,自建SG"

[YAML]
# OpenClash 会在生成运行配置时按插件设置重建 sniffer/tun，这里在最后阶段写回关键差异。
sniffer:
  # 嗅探总开关，插件生成运行配置时可能被重置，此处确保开启
  enable: true
  # 解析纯 IP 连接的域名，提升 IP 直连和 fake-ip 场景下的分流准确性。
  parse-pure-ip: true

tun:
  # 使用 mixed 栈并固定 PPPoE 友好的 MTU，避免插件默认 system 栈丢弃本地 MTU 设置。
  stack: mixed
  mtu: 1492
  # 劫持所有 53 端口 DNS 请求，避免运行态只劫持 127.0.0.1:53 导致局域网 DNS 接管变弱。
  dns-hijack:
    - any:53
    - tcp://any:53
